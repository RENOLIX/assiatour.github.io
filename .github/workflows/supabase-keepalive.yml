name: Supabase keepalive

on:
  schedule:
    - cron: "17 8 */5 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping public trips endpoint
        env:
          SUPABASE_URL: https://lhvnnglwfvxqtcqqxhaz.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable__eLhBhgFC2O3buoIcPQbuQ_eGSojPgH
        run: |
          curl --fail --silent --show-error \
            "${SUPABASE_URL}/rest/v1/trips?select=id&limit=1" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}"
